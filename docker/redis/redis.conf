# Redis configuration for the BOLD Public Portal
# Redis is used as a cache for metadata and pre-computed summaries

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Snapshotting (RDB persistence)
# Disable RDB persistence as Redis is used as a cache and data can be regenerated
save ""

# Disable AOF persistence
appendonly no

# Logging
loglevel notice

# Network
# bind to all interfaces to allow inter-container communication on Docker's internal network
# protected-mode is disabled as no authentication is configured and connections come from container IPs
bind 0.0.0.0
protected-mode no
tcp-keepalive 300
timeout 0
