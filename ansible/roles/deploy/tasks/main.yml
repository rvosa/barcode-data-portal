---

- name: Prepare environment
  ansible.builtin.include_tasks: prepare.yml

- name: Check mandatory environment variables
  ansible.builtin.fail:
    msg: Missing environment variable
  when: lookup('env', item)|length == 0
  with_items:
    - IMAGE_VERSION

- name: Create Docker current image version file
  ansible.builtin.copy:
    content: |
      {{ lookup('env', 'IMAGE_VERSION') }}
    dest: /opt/compose_projects/{{ project }}/compose/current_image_version.txt
    mode: "0644"
    owner: root
    group: root

- name: Copy docker-compose file
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../docker-compose-naturalis/cluster/docker-compose.yml'
    dest: /opt/compose_projects/{{ project }}/compose/docker-compose.yml
    mode: "0644"
    owner: root
    group: root

