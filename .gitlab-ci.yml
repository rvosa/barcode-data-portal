variables:
  SERVICE_NAME: bold-eu
  SERVICE_DOMAIN: bii
  VAULT_AUTH_ROLE: jwt-${SERVICE_NAME}
  VAULT_SERVER_URL: https://vault.naturalis.io
  VAULT_PATH: ${SERVICE_DOMAIN}/${SERVICE_NAME}
  ANSIBLE_VERSION: 10.4.0
  TRIVY_DB_REPOSITORY: "aquasec/trivy-db:2"

.job_id_tokens: &job_id_tokens
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://${CI_SERVER_HOST}

stages:
  - check
  - build
  - test
  - publish
  - deploy

isort:
   stage: check
   rules:
     - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null
     - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
     - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_TAG == null
   image: registry.gitlab.com/mafda/python-linting
   script:
     - isort . --check-only
   allow_failure: true

black:
   stage: check
   rules:
     - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null
     - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
     - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_TAG == null
   image: registry.gitlab.com/mafda/python-linting
   script:
     - black --check .
   allow_failure: true

flake8:
   stage: check
   rules:
     - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null
     - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
     - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_TAG == null
   image: registry.gitlab.com/mafda/python-linting
   script:
     - flake8 --verbose .
   allow_failure: true

pylint:
   stage: check
   rules:
     - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null
     - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
     - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_TAG == null
   image: registry.gitlab.com/mafda/python-linting
   script:
     - find . -type f -name "*.py" | xargs pylint
   allow_failure: true

hadolint:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_TAG == null
  image: hadolint/hadolint:latest-debian
  script:
    - hadolint docker/Dockerfile
    - hadolint docker/Dockerfile.socketserver_logging

ShellCheck:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_TAG == null
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck docker/*.sh

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  extends: .secret-analyzer
  stage: check
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "false"
    SECRET_DETECTION_REPORT_FILE: "gl-secret-detection-report.json"
  artifacts:
    reports:
      secret_detection: $SECRET_DETECTION_REPORT_FILE
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_TAG == null
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_TAG == null && $CI_COMMIT_BRANCH == null
  allow_failure: false
  before_script:
    - apk add --no-cache jq
  script:
    - /analyzer run
    - |
      if [ -f "$SECRET_DETECTION_REPORT_FILE" ]; then
        if [ "$(jq ".vulnerabilities | length" $SECRET_DETECTION_REPORT_FILE)" -gt 0 ]; then
          echo "Vulnerabilities detected!"
          echo "Please check the $SECRET_DETECTION_REPORT_FILE security file."
          echo "Or run gitleak locally on your repository."
          exit 1
        fi
      else
        echo "Artifact $SECRET_DETECTION_REPORT_FILE does not exist."
        echo "No evaluation can be performed."
      fi

Image build:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_TAG == null
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo -n $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - source docker/export_cache_tags.sh
    - docker/build_and_push.sh

# Only run test before deployment, as it takes ages
Cypress test:
  <<: *job_id_tokens
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_TAG == null && $CI_COMMIT_BRANCH != null
  image: docker:24
  allow_failure: true
  services:
    - docker:24-dind
  before_script:
    - source ansible/export_image_version.sh
    - docker/prepare_cypress.sh
  script:
    - docker/start_cypress.sh

Trivy vulnerability scanner:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_TAG == null
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker create --name trivy aquasec/trivy:latest
    - docker cp trivy:/usr/local/bin/trivy /usr/local/bin/trivy
    - docker rm -f trivy
    - "wget --header \"PRIVATE-TOKEN: $TRIVYIGNORE_ACCESS_TOKEN\" \"https://gitlab.com/api/v4/projects/41791412/repository/files/trivyignore/raw?ref=main\" --output-document=.trivyignore"
    - trivy --version
    - |
      if [ ! -f .trivy/db/trivy.db ] || [ $(find .trivy/ -name "trivy.db" -mtime +1 | grep "trivy.db") ]; then
          echo "Download the trivy db!";
          rm -rf .trivy/db;
          trivy image --cache-dir .trivy/ --download-db-only --db-repository $TRIVY_DB_REPOSITORY;
      fi
    - echo -n $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cat .trivyignore
    - trivy --cache-dir .trivy/ --quiet
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --removed-pkgs "$CI_REGISTRY_IMAGE/fastapi-app:build_$CI_COMMIT_REF_SLUG"
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --removed-pkgs "$CI_REGISTRY_IMAGE/socketserver-logging:build_$CI_COMMIT_REF_SLUG"

Image publish:
  stage: publish
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_TAG == null
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo -n $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker/publish.sh "fastapi-app"
    - docker/publish.sh "socketserver-logging"

# Deploy git branch develop and any feature branch that is manually run from GitLab to development
Development deploy:
  <<: *job_id_tokens
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_TAG == null && $CI_COMMIT_BRANCH != null
  image: docker:24
  services:
    - docker:24-dind
  variables:
    ANSIBLE_CONFIG: $CI_PROJECT_DIR/ansible/ansible.cfg
  before_script:
    - apk add --no-cache jq curl
    - export VAULT_TOKEN=$(curl -s --request POST --data {\"role\":\"${VAULT_AUTH_ROLE}\",\"jwt\":\"${VAULT_ID_TOKEN}\"} $VAULT_SERVER_URL/v1/auth/jwt/login | jq -r .auth.client_token)
    - ansible/ci_setup.sh
    - ansible/pull_vault_secrets.sh
  script:
    - source ansible/export_image_version.sh
    - docker run -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e ANSIBLE_CONFIG=/runner/ansible/ansible.cfg -e IMAGE_VERSION -e CI_REGISTRY -e CI_REGISTRY_USER -e CI_REGISTRY_PASSWORD -t -v "$CI_PROJECT_DIR/:/runner/" -v "$CI_PROJECT_DIR/ansible/secrets/:/root/.ssh" -w /runner registry.gitlab.com/naturalis/lib/ansible/docker-ansible:latest ansible-playbook -i "ansible/inventory/hosts.yml" ansible/deploy.yml -l ${LIMIT:-'dev'}
  after_script:
    - rm -rf ansible/secrets/

# Only deploy git tag that is manually run from GitLab to production
Production deploy:
  <<: *job_id_tokens
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_TAG != null
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_TAG != null
  image: docker:24
  services:
    - docker:24-dind
  variables:
    ANSIBLE_CONFIG: $CI_PROJECT_DIR/ansible/ansible.cfg
  before_script:
    - apk add --no-cache jq curl
    - export VAULT_TOKEN=$(curl -s --request POST --data {\"role\":\"${VAULT_AUTH_ROLE}\",\"jwt\":\"${VAULT_ID_TOKEN}\"} $VAULT_SERVER_URL/v1/auth/jwt/login | jq -r .auth.client_token)
    - ansible/ci_setup.sh
    - ansible/pull_vault_secrets.sh
  script:
    - source ansible/export_image_version.sh
    - docker run -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e ANSIBLE_CONFIG=/runner/ansible/ansible.cfg -e IMAGE_VERSION -e CI_REGISTRY -e CI_REGISTRY_USER -e CI_REGISTRY_PASSWORD -t -v "$CI_PROJECT_DIR/:/runner/" -v "$CI_PROJECT_DIR/ansible/secrets/:/root/.ssh" -w /runner registry.gitlab.com/naturalis/lib/ansible/docker-ansible:latest ansible-playbook -i "ansible/inventory/hosts.yml" ansible/deploy.yml -l ${LIMIT:-'prod'}
  after_script:
    - rm -rf ansible/secrets/
